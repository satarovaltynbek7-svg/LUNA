<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ed" />
    <script>
      try {
        const saved = localStorage.getItem('luna-theme');
        document.documentElement.dataset.theme = (saved === 'night' || saved === 'day') ? saved : 'day';
      } catch {
        document.documentElement.dataset.theme = 'day';
      }
    </script>
    <meta name="description" content="LUNA Café — уютное место для хорошего кофе, неспешных утр и тёплых встреч." />
    <title>LUNA Café — маленький момент волшебства</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
